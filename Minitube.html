
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">▶ MiniTube</div>

    <input type="text" id="search" placeholder="Search videos...">
    <button onclick="searchVideos()">Search</button>
</header>

<div class="container">

    <aside>
        <button onclick="showAll()">🏠 Home</button>
        <button onclick="filterVideos('Music')">🎵 Music</button>
        <button onclick="filterVideos('Gaming')">🎮 Gaming</button>
        <button onclick="filterVideos('Education')">📚 Education</button>
        <button onclick="filterVideos('Technology')">💻 Technology</button>
        <button onclick="showLiked()">❤️ Liked Videos</button>
    </aside>

    <main>
        <div id="player">
            <iframe id="videoFrame" allowfullscreen></iframe>
            <h2 id="videoTitle">Welcome to MiniTube!</h2>
        </div>

        <div class="videos" id="videos"></div>
        <p id="empty"></p>
    </main>

</div>

<script src="script.js"></script>
</body>
</html>
